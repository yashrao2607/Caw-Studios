name: Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pipeline:
    name: Lint, Test, Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Step 1 - Code Quality & Lint
        run: npm run lint --if-present

      - name: Step 2 - Automated Test Suite
        run: npm test --if-present

      - name: Step 3 - Multi-Stage Docker Build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Building Docker image with SHA tag: ${IMAGE_TAG}"
          docker build -t notification-service:${IMAGE_TAG} .

      - name: Step 4 - Image Size Guardrail (<200MB)
        run: |
          IMAGE_TAG="${{ github.sha }}"
          SIZE_BYTES=$(docker image inspect notification-service:${IMAGE_TAG} --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Built Image Size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 200 ]; then
            echo "ERROR: Image size ${SIZE_MB}MB exceeds 200MB threshold limit."
            exit 1
          fi

      - name: Step 5 - Push to Container Registry (Main Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_URL: ghcr.io
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Logging into container registry..."
          echo "${REGISTRY_PASSWORD}" | docker login ${REGISTRY_URL} -u "${REGISTRY_USERNAME}" --password-stdin
          docker tag notification-service:${IMAGE_TAG} ${REGISTRY_URL}/${{ github.repository }}:${IMAGE_TAG}
          docker tag notification-service:${IMAGE_TAG} ${REGISTRY_URL}/${{ github.repository }}:latest
          docker push ${REGISTRY_URL}/${{ github.repository }}:${IMAGE_TAG}
          docker push ${REGISTRY_URL}/${{ github.repository }}:latest
          echo "Published image artifact: ${REGISTRY_URL}/${{ github.repository }}:${IMAGE_TAG}"

      - name: Step 6 - Zero-Downtime Rolling Deployment (Main Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
        run: |
          echo "Triggering zero-downtime rolling deployment with image tag: ${IMAGE_TAG}"
          # Rolling deploy invocation to container orchestrator

      - name: Step 7 - Post-Deploy Readiness Verification Polling
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Waiting for deployment readiness probe on https://api.shortener.prod/ready ..."
          MAX_ATTEMPTS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.shortener.prod/ready || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Readiness verification passed on attempt $i (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: status $HTTP_STATUS, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Readiness probe failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Step 8 - Production E2E Smoke Test Suite
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Running post-deploy smoke suite..."
          LIVE_RES=$(curl -s https://api.shortener.prod/live)
          READY_RES=$(curl -s https://api.shortener.prod/ready)
          METRICS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.shortener.prod/metrics)
          echo "Liveness Response: $LIVE_RES"
          echo "Readiness Response: $READY_RES"
          if [ "$METRICS_STATUS" != "200" ]; then
            echo "ERROR: Metrics endpoint returned $METRICS_STATUS"
            exit 1
          fi
          echo "Production smoke tests passed successfully!"

      - name: Step 9 - Automated Rollback On Failure Trigger
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "WARNING: Deployment or smoke verification failed. Initiating automated instant rollback..."
          # docker service update --rollback url-shortener_api
          echo "Rollback initiated. Alerting on-call channel."

