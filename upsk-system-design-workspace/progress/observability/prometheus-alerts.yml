groups:
  - name: api-service-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API Error rate exceeds 5%"
          description: "Service has an error rate of {{ $value | humanizePercentage }} over the last 5 minutes. More than 1 in 20 requests is failing."
          runbook: "https://wiki.internal/runbooks/high-error-rate"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency exceeds 2 seconds"
          description: "API p95 latency is {{ $value | humanizeDuration }}. 5% of users are experiencing response times over 2 seconds."
          runbook: "https://wiki.internal/runbooks/high-latency"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Service instance is unreachable"
          description: "Prometheus scraper cannot reach GET /metrics on {{ $labels.instance }} for more than 1 minute."
          runbook: "https://wiki.internal/runbooks/service-down"
